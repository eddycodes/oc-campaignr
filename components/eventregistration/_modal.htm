<!-- Registration Modal - Shared Partial -->
<div class="modal fade registration-modal" id="registrationModal" tabindex="-1" role="dialog" aria-labelledby="registrationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="registrationModalLabel">
                    <i class="fa fa-user-plus"></i> Event Registration
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="modal-event-info" class="event-info mb-4" style="display: none;">
                    <h3 class="event-title" id="modal-event-name"></h3>
                    <p class="event-date" id="modal-event-date"></p>
                </div>

                <div id="registration-form">
                    <form data-request="onRegisterEvent"
                          data-request-flash
                          data-request-validate
                          data-request-success="$('#registrationModal').modal('hide'); $.oc.flashMsg({text: 'Registration successful! Check your email for confirmation.', class: 'success', interval: 3});"
                          class="registration-form">

                        <input type="hidden" name="event_id" id="modal-event-id" />

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal_first_name" class="form-label">
                                    First Name <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="modal_first_name"
                                       name="first_name"
                                       required>
                                <span data-validate-for="first_name" class="text-danger"></span>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="modal_other_name" class="form-label">Other Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="modal_other_name"
                                       name="other_name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="modal_last_name" class="form-label">
                                Last Name <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="modal_last_name"
                                   name="last_name"
                                   required>
                            <span data-validate-for="last_name" class="text-danger"></span>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal_email" class="form-label">
                                    Email Address <span class="text-danger">*</span>
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="modal_email"
                                       name="email"
                                       required>
                                <span data-validate-for="email" class="text-danger"></span>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="modal_phone_number" class="form-label">
                                    Phone Number <span class="text-danger">*</span>
                                </label>
                                <input type="tel"
                                       class="form-control"
                                       id="modal_phone_number"
                                       name="phone_number"
                                       required>
                                <span data-validate-for="phone_number" class="text-danger"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="modal_organisation_name" class="form-label">Organisation Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="modal_organisation_name"
                                   name="organisation_name">
                        </div>

                        <div class="mb-3">
                            <label for="modal_additional_information" class="form-label">
                                Additional Information
                            </label>
                            <textarea class="form-control"
                                      id="modal_additional_information"
                                      name="additional_information"
                                      rows="4"></textarea>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">
                                <i class="fa fa-times"></i> Cancel
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-check"></i> Register Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load Registration Assets -->
<link rel="stylesheet" href="{{ 'plugins/impulsetechnologies/campaignr/assets/css/registration.css'|theme }}">
<script src="{{ 'plugins/impulsetechnologies/campaignr/assets/js/registration.js'|theme }}"></script>
