<div class="event-registration-component">
    <div class="registration-form-wrapper">
        <div id="registration-form">
            {% if event %}
                <div class="event-info mb-4">
                    <h3 class="event-title">{{ event.name }}</h3>
                    {% if event.time_begin %}
                        <p class="event-date">
                            <i class="fa fa-calendar"></i>
                            {{ event.time_begin|date('F j, Y') }}
                            {% if event.time_end %}
                                at {{ event.time_begin|date('g:i A') }}
                            {% endif %}
                        </p>
                    {% endif %}
                </div>

                <form data-request="onRegister"
                      data-request-flash
                      data-request-validate
                      class="registration-form">

                    <input type="hidden" name="event_id" value="{{ event.id }}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">
                                First Name <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="first_name"
                                   name="first_name"
                                   required>
                            <span data-validate-for="first_name" class="text-danger"></span>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="other_name" class="form-label">Other Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="other_name"
                                   name="other_name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="last_name" class="form-label">
                            Last Name <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="last_name"
                               name="last_name"
                               required>
                        <span data-validate-for="last_name" class="text-danger"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">
                                Email Address <span class="text-danger">*</span>
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   required>
                            <span data-validate-for="email" class="text-danger"></span>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="phone_number" class="form-label">
                                Phone Number <span class="text-danger">*</span>
                            </label>
                            <input type="tel"
                                   class="form-control"
                                   id="phone_number"
                                   name="phone_number"
                                   required>
                            <span data-validate-for="phone_number" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="organisation_name" class="form-label">Organisation Name</label>
                        <input type="text"
                               class="form-control"
                               id="organisation_name"
                               name="organisation_name">
                    </div>

                    <div class="mb-3">
                        <label for="additional_information" class="form-label">
                            Additional Information
                        </label>
                        <textarea class="form-control"
                                  id="additional_information"
                                  name="additional_information"
                                  rows="4"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fa fa-check"></i> Register Now
                        </button>
                    </div>
                </form>
            {% else %}
                <div class="alert alert-warning">
                    Event not found.
                </div>
            {% endif %}
        </div>
    </div>
</div>
