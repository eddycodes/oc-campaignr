fields:
    name:
        label: 'impulsetechnologies.campaignr::lang.fields.name'
        span: auto
        required: 1
        type: text
        tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
    slug:
        label: 'impulsetechnologies.campaignr::lang.fields.slug'
        span: auto
        required: 1
        preset:
            field: name
            type: slug
        type: text
        tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
    toolbar:
        type: partial
        path: event_toolbar
        cssClass: collapse-visible
secondaryTabs:
    fields:
        time_begin:
            label: 'impulsetechnologies.campaignr::lang.fields.begins_at'
            mode: datetime
            span: auto
            required: 1
            type: datepicker
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        time_end:
            label: 'impulsetechnologies.campaignr::lang.fields.ends_at'
            mode: datetime
            span: auto
            required: 1
            type: datepicker
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        all_day:
            label: 'impulsetechnologies.campaignr::lang.fields.all_day'
            span: auto
            type: switch
            comment: 'impulsetechnologies.campaignr::lang.fields.all_day_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        repeat_event:
            label: 'impulsetechnologies.campaignr::lang.fields.repeat'
            span: auto
            default: 0
            required: 0
            type: switch
            comment: 'impulsetechnologies.campaignr::lang.fields.repeat_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        repeat_mode:
            label: 'impulsetechnologies.campaignr::lang.fields.repeat_mode'
            options:
                1: 'impulsetechnologies.campaignr::lang.fields.repeat_day'
                2: 'impulsetechnologies.campaignr::lang.fields.repeat_week'
                3: 'impulsetechnologies.campaignr::lang.fields.repeat_month'
                4: 'impulsetechnologies.campaignr::lang.fields.repeat_year'
            span: auto
            default: '2'
            hidden: 0
            trigger:
                action: show
                field: repeat_event
                condition: checked
            type: balloon-selector
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        end_repeat_on:
            label: 'impulsetechnologies.campaignr::lang.fields.end_repeat'
            mode: date
            span: right
            trigger:
                action: show
                field: repeat_event
                condition: checked
            type: datepicker
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        category:
            label: 'impulsetechnologies.campaignr::lang.fields.category'
            type: dropdown
            emptyOption: 'impulsetechnologies.campaignr::lang.fields.category_empty'
            options:
                'CPD': 'impulsetechnologies.campaignr::lang.fields.categories.cpd'
                'Exams': 'impulsetechnologies.campaignr::lang.fields.categories.exams'
                'Critical dates': 'impulsetechnologies.campaignr::lang.fields.categories.critical_dates'
                'Public holiday': 'impulsetechnologies.campaignr::lang.fields.categories.public_holiday'
            comment: 'impulsetechnologies.campaignr::lang.fields.category_comment'
            span: auto
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        cost:
            label: 'impulsetechnologies.campaignr::lang.fields.cost'
            span: auto
            type: text
            comment: 'impulsetechnologies.campaignr::lang.fields.cost_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        website:
            label: 'impulsetechnologies.campaignr::lang.fields.website'
            span: auto
            type: text
            comment: 'impulsetechnologies.campaignr::lang.fields.website_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        image:
            label: 'impulsetechnologies.campaignr::lang.fields.image'
            span: auto
            type: fileupload
            mode: image
            imageWidth: 260
            comment: 'impulsetechnologies.campaignr::lang.fields.image_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        excerpt:
            label: 'impulsetechnologies.campaignr::lang.fields.excerpt'
            span: full
            type: textarea
            size: small
            comment: 'impulsetechnologies.campaignr::lang.fields.excerpt_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_details'
        description:
            size: ''
            mode: split
            span: full
            type: markdown
            stretch: true
            tab: 'impulsetechnologies.campaignr::lang.fields.description'
        location_street:
            label: 'impulsetechnologies.campaignr::lang.fields.location.street'
            span: auto
            type: text
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        location_number:
            label: 'impulsetechnologies.campaignr::lang.fields.location.number'
            span: auto
            type: text
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        location_zip:
            label: 'impulsetechnologies.campaignr::lang.fields.location.zip'
            span: auto
            type: text
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        location_city:
            label: 'impulsetechnologies.campaignr::lang.fields.location.city'
            span: auto
            type: text
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        location_country:
            label: 'impulsetechnologies.campaignr::lang.fields.location.country'
            span: auto
            type: text
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        location_misc:
            label: 'impulsetechnologies.campaignr::lang.fields.location.misc'
            span: full
            type: text
            commentAbove: 'impulsetechnologies.campaignr::lang.fields.location.misc_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_location'
        source_id:
            label: 'impulsetechnologies.campaignr::lang.fields.source_id'
            span: auto
            readOnly: true
            type: text
            comment: 'impulsetechnologies.campaignr::lang.fields.source_id_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_source'
        source_url:
            label: 'impulsetechnologies.campaignr::lang.fields.source_url'
            span: auto
            readOnly: true
            type: text
            comment: 'impulsetechnologies.campaignr::lang.fields.source_url_comment'
            tab: 'impulsetechnologies.campaignr::lang.fields.tab_source'
